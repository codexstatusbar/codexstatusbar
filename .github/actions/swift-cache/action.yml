name: Swift build cache
description: Cache compiler outputs and dependencies by toolchain, lockfile and build mode.
inputs:
  mode:
    description: debug, release or verify
    required: true
runs:
  using: composite
  steps:
    - id: toolchain
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
      run: |
        case "$CACHE_MODE" in debug|release|verify) ;; *) exit 2 ;; esac
        identity="$({ swiftc --version 2>&1; xcrun --show-sdk-version; xcrun --show-sdk-path; sw_vers -productVersion; } | shasum -a 256 | cut -d ' ' -f 1)"
        printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          .build/checkouts
          .build/repositories
          .build/artifacts
          .build/prebuilts
          .build/workspace-state.json
          .build/build.db
          .build/.buildSystem_${{ inputs.mode }}
          .build/${{ inputs.mode }}.yaml
          .build/arm64-apple-macosx/${{ inputs.mode }}
          .build/fixture-cache
          ~/Library/Caches/org.swift.swiftpm
        key: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ inputs.mode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
        restore-keys: |
          swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ inputs.mode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
