name: macOS bundle

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  TOKLOOM_CACHE_FIXTURES: '1'

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - id: swift-cache
        uses: ./.github/actions/swift-cache
        with:
          mode: debug
      - name: Core and collector tests
        env:
          EXACT_CACHE_HIT: ${{ steps.swift-cache.outputs.exact-hit }}
        run: |
          swift --version
          build_args=()
          if [[ "$EXACT_CACHE_HIT" == true ]]; then build_args+=(--skip-build); fi
          swift test --build-system native --disable-xctest "${build_args[@]}" \
            -Xcxx -isystem -Xcxx "$(xcrun --show-sdk-path)/usr/include/c++/v1" 2>&1 | tee test.log
      - name: Release notes regression tests
        run: python3 -m unittest discover -s Tests/ReleaseNotesTests -v 2>&1 | tee -a test.log
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-log
          path: test.log
          if-no-files-found: warn
          retention-days: 14

  verify:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - id: swift-cache
        uses: ./.github/actions/swift-cache
        with:
          mode: verify
      - name: Synthetic UI and isolated process checks
        run: ./scripts/capture-fixtures.sh .build/ui-evidence 2>&1 | tee verify.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-verification
          path: |
            verify.log
            .build/ui-evidence/*.png
          if-no-files-found: warn
          retention-days: 14

  bundle:
    permissions:
      contents: write
    needs: [test, verify]
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: swift-cache
        uses: ./.github/actions/swift-cache
        with:
          mode: release
      - name: Build and package arm64 app
        env:
          TOKLOOM_REUSE_COMPILED: ${{ steps.swift-cache.outputs.exact-hit }}
        run: ./scripts/package-app.sh 2>&1 | tee bundle.log
      - name: Upload app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tokloom-macos-arm64-${{ github.sha }}
          path: |
            .build/dist/Tokloom-macos-arm64.dmg
            .build/dist/Tokloom-macos-arm64.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/release-notes.py "$RELEASE_TAG" --repo "$GH_REPO" > .build/release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" .build/dist/Tokloom-macos-arm64.dmg .build/dist/Tokloom-macos-arm64.dmg.sha256 --clobber
            gh release edit "$RELEASE_TAG" --notes-file .build/release-notes.md
          else
            gh release create "$RELEASE_TAG" .build/dist/Tokloom-macos-arm64.dmg .build/dist/Tokloom-macos-arm64.dmg.sha256 \
              --verify-tag --title "Tokloom $RELEASE_TAG" \
              --notes-file .build/release-notes.md
          fi
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-log
          path: bundle.log
          if-no-files-found: warn
          retention-days: 14

  cleanup:
    needs: [bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete this run's artifacts after release publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          uploaded="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '[.assets[] | select(.state == "uploaded") | .name] | contains(["Tokloom-macos-arm64.dmg", "Tokloom-macos-arm64.dmg.sha256"])')"
          test "$uploaded" = true
          ids="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate --jq '.artifacts[].id')"
          while IFS= read -r id; do
            test -n "$id" || continue
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
            printf 'Removed Actions artifact %s; release assets and caches retained.\n' "$id"
          done <<< "$ids"
